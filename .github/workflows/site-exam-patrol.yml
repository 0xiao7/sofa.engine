name: Site Exam Patrol

on:
  schedule:
    - cron: "35 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run read-only production patrol
        run: node scripts/site_exam_patrol.mjs
        env:
          SITE_EXAM_PATROL_REPORT: artifacts/site-exam-patrol.json
      - name: Archive bounded report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-exam-patrol
          path: artifacts/site-exam-patrol.json
          if-no-files-found: error
          retention-days: 14
